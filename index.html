<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Poster Generator Tool</title>
    <!-- Inline Fabric.js library for offline use -->
    <script>
        // Minimal Fabric.js implementation for canvas functionality
        window.fabric = {
            Canvas: function(element, options = {}) {
                const canvas = document.getElementById(element);
                const ctx = canvas.getContext('2d');
                
                // Set canvas dimensions
                canvas.width = options.width || 600;
                canvas.height = options.height || 800;
                
                this.canvas = canvas;
                this.ctx = ctx;
                this.objects = [];
                this.backgroundColor = options.backgroundColor || '#000000';
                this.activeObject = null;
                
                // Set initial background
                this.setBackgroundColor(this.backgroundColor);
                
                return this;
            },
            
            Text: function(text, options = {}) {
                this.type = 'text';
                this.text = text;
                this.left = options.left || 0;
                this.top = options.top || 0;
                this.fontSize = options.fontSize || 20;
                this.fontFamily = options.fontFamily || 'Arial';
                this.fill = options.fill || '#000000';
                this.fontWeight = options.fontWeight || 'normal';
                this.originX = options.originX || 'left';
                this.originY = options.originY || 'top';
                this.selectable = options.selectable !== false;
                this.evented = options.evented !== false;
                this.backgroundColor = options.backgroundColor || '';
                this.padding = options.padding || 0;
                
                return this;
            },
            
            Image: {
                fromURL: function(url, callback) {
                    const img = new Image();
                    img.onload = function() {
                        const fabricImg = {
                            type: 'image',
                            _element: img,
                            width: img.width,
                            height: img.height,
                            left: 0,
                            top: 0,
                            scaleX: 1,
                            scaleY: 1,
                            originX: 'left',
                            originY: 'top',
                            selectable: true,
                            evented: true,
                            
                            set: function(props) {
                                Object.assign(this, props);
                                return this;
                            }
                        };
                        callback(fabricImg);
                    };
                    img.src = url;
                }
            },
            
            Polygon: function(points, options = {}) {
                this.type = 'polygon';
                this.points = points;
                this.fill = options.fill || '#000000';
                this.selectable = options.selectable !== false;
                this.evented = options.evented !== false;
                
                return this;
            }
        };
        
        // Extend Canvas prototype with methods
        fabric.Canvas.prototype.setBackgroundColor = function(color, callback) {
            this.backgroundColor = color;
            this.requestRenderAll();
            if (callback) callback();
        };
        
        fabric.Canvas.prototype.add = function(...objects) {
            objects.forEach(obj => this.objects.push(obj));
            this.requestRenderAll();
        };
        
        fabric.Canvas.prototype.remove = function(obj) {
            const index = this.objects.indexOf(obj);
            if (index > -1) {
                this.objects.splice(index, 1);
                this.requestRenderAll();
            }
        };
        
        fabric.Canvas.prototype.sendToBack = function(obj) {
            this.remove(obj);
            this.objects.unshift(obj);
            this.requestRenderAll();
        };
        
        fabric.Canvas.prototype.bringToFront = function(obj) {
            this.remove(obj);
            this.objects.push(obj);
            this.requestRenderAll();
        };
        
        fabric.Canvas.prototype.requestRenderAll = function() {
            this.ctx.fillStyle = this.backgroundColor;
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            
            this.objects.forEach(obj => {
                this.ctx.save();
                
                if (obj.type === 'text') {
                    // Set text properties
                    this.ctx.font = `${obj.fontWeight} ${obj.fontSize}px ${obj.fontFamily}`;
                    this.ctx.fillStyle = obj.fill;
                    this.ctx.textAlign = obj.originX === 'center' ? 'center' : 'left';
                    this.ctx.textBaseline = obj.originY === 'center' ? 'middle' : 'top';
                    
                    // Draw background highlight if set
                    if (obj.backgroundColor) {
                        const metrics = this.ctx.measureText(obj.text);
                        const padding = obj.padding;
                        this.ctx.fillStyle = obj.backgroundColor;
                        this.ctx.fillRect(
                            obj.left - padding - (obj.originX === 'center' ? metrics.width / 2 : 0),
                            obj.top - padding - (obj.originY === 'center' ? obj.fontSize / 2 : 0),
                            metrics.width + padding * 2,
                            obj.fontSize + padding * 2
                        );
                        this.ctx.fillStyle = obj.fill;
                    }
                    
                    this.ctx.fillText(obj.text, obj.left, obj.top);
                    
                } else if (obj.type === 'image') {
                    const width = obj.width * obj.scaleX;
                    const height = obj.height * obj.scaleY;
                    let drawX = obj.left;
                    let drawY = obj.top;
                    
                    if (obj.originX === 'center') drawX -= width / 2;
                    if (obj.originY === 'center') drawY -= height / 2;
                    if (obj.originY === 'top') drawY = obj.top;
                    
                    this.ctx.drawImage(obj._element, drawX, drawY, width, height);
                    
                } else if (obj.type === 'polygon') {
                    this.ctx.fillStyle = obj.fill;
                    this.ctx.beginPath();
                    obj.points.forEach((point, index) => {
                        if (index === 0) {
                            this.ctx.moveTo(point.x, point.y);
                        } else {
                            this.ctx.lineTo(point.x, point.y);
                        }
                    });
                    this.ctx.closePath();
                    this.ctx.fill();
                }
                
                this.ctx.restore();
            });
        };
        
        fabric.Canvas.prototype.getActiveObject = function() {
            return this.activeObject;
        };
        
        fabric.Canvas.prototype.setActiveObject = function(obj) {
            this.activeObject = obj;
        };
        
        fabric.Canvas.prototype.discardActiveObject = function() {
            this.activeObject = null;
        };
        
        fabric.Canvas.prototype.toDataURL = function(options = {}) {
            return this.canvas.toDataURL(options.format || 'image/png', options.quality || 1);
        };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 30px;
            text-align: center;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }

        .input-field, select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .input-field:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .range-input {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e1e5e9;
            outline: none;
            -webkit-appearance: none;
        }

        .range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }

        .color-input {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .canvas-container {
            position: relative;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        #poster-canvas {
            display: block;
            border-radius: 15px;
        }

        .highlight-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .text-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 1200px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <h1>🎨 Poster Generator</h1>
            
            <div class="section">
                <div class="section-title">Canvas Settings</div>
                <div class="input-group">
                    <label class="input-label">Background Color</label>
                    <input type="color" id="bg-color" class="color-input" value="#000000">
                </div>
            </div>

            <div class="section">
                <div class="section-title">Background Image</div>
                <div class="input-group">
                    <label class="input-label">Upload Image</label>
                    <input type="file" id="bg-image" class="input-field" accept="image/*">
                </div>
                <div class="input-group">
                    <label class="input-label">Image Controls</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <button class="btn btn-secondary" id="move-image">📐 Move</button>
                        <button class="btn btn-secondary" id="resize-image">🔄 Resize</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Logo</div>
                <div class="input-group">
                    <label class="input-label">Upload Logo</label>
                    <input type="file" id="logo-upload" class="input-field" accept="image/*">
                </div>
            </div>

            <div class="section">
                <div class="section-title">Headline Text</div>
                <div class="input-group">
                    <label class="input-label">Headline</label>
                    <input type="text" id="headline-text" class="input-field" placeholder="Enter headline..." value="AMAZING POSTER">
                </div>
                <div class="text-controls">
                    <div class="input-group">
                        <label class="input-label">Font</label>
                        <select id="headline-font" class="input-field">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Size</label>
                        <input type="range" id="headline-size" class="range-input" min="20" max="80" value="48">
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Color</label>
                    <input type="color" id="headline-color" class="color-input" value="#ffffff">
                </div>
            </div>

            <div class="section">
                <div class="section-title">Subtitle Text</div>
                <div class="input-group">
                    <label class="input-label">Subtitle</label>
                    <input type="text" id="subtitle-text" class="input-field" placeholder="Enter subtitle..." value="Your subtitle here">
                </div>
                <div class="text-controls">
                    <div class="input-group">
                        <label class="input-label">Font</label>
                        <select id="subtitle-font" class="input-field">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Size</label>
                        <input type="range" id="subtitle-size" class="range-input" min="12" max="40" value="24">
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Color</label>
                    <input type="color" id="subtitle-color" class="color-input" value="#ffffff">
                </div>
            </div>

            <div class="section">
                <div class="section-title">Text Highlighting</div>
                <div class="input-group">
                    <label class="input-label">Highlight Color</label>
                    <input type="color" id="highlight-color" class="color-input" value="#ffff00">
                </div>
                <div class="highlight-controls">
                    <div class="input-group" style="flex: 1;">
                        <label class="input-label">Width</label>
                        <input type="range" id="highlight-width" class="range-input" min="0" max="20" value="5">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label class="input-label">Height</label>
                        <input type="range" id="highlight-height" class="range-input" min="0" max="20" value="5">
                    </div>
                </div>
                <div class="input-group">
                    <button class="btn btn-secondary" id="toggle-highlight">✨ Toggle Highlight</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Export</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="btn" id="download-png">📸 PNG</button>
                    <button class="btn" id="download-jpeg">📷 JPEG</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="poster-canvas" width="600" height="800"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Fabric.js canvas
        const canvas = new fabric.Canvas('poster-canvas', {
            width: 600,
            height: 800,
            backgroundColor: '#000000'
        });

        // Global variables
        let backgroundImageObj = null;
        let logoObj = null;
        let headlineObj = null;
        let subtitleObj = null;

        // Create diagonal borders
        function createDiagonalBorders() {
            const borderWidth = 20;
            const canvasWidth = canvas.width;
            const canvasHeight = canvas.height;
            
            // Top diagonal border
            const topBorder = new fabric.Polygon([
                {x: 0, y: 0},
                {x: canvasWidth, y: 0},
                {x: canvasWidth - borderWidth * 2, y: borderWidth},
                {x: borderWidth * 2, y: borderWidth}
            ], {
                fill: '#ffffff',
                selectable: false,
                evented: false
            });

            // Bottom diagonal border  
            const bottomBorder = new fabric.Polygon([
                {x: borderWidth * 2, y: canvasHeight - borderWidth},
                {x: canvasWidth - borderWidth * 2, y: canvasHeight - borderWidth},
                {x: canvasWidth, y: canvasHeight},
                {x: 0, y: canvasHeight}
            ], {
                fill: '#ffffff',
                selectable: false,
                evented: false
            });

            canvas.add(topBorder, bottomBorder);
        }

        // Initialize diagonal borders
        createDiagonalBorders();

        // Background color control
        document.getElementById('bg-color').addEventListener('input', (e) => {
            canvas.setBackgroundColor(e.target.value);
        });

        // Background image upload
        document.getElementById('bg-image').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    fabric.Image.fromURL(event.target.result, (img) => {
                        // Remove existing background image
                        if (backgroundImageObj) {
                            canvas.remove(backgroundImageObj);
                        }
                        
                        // Scale image to fit canvas while maintaining aspect ratio
                        const scaleX = canvas.width / img.width;
                        const scaleY = canvas.height / img.height;
                        const scale = Math.min(scaleX, scaleY);
                        
                        img.set({
                            scaleX: scale,
                            scaleY: scale,
                            left: (canvas.width - img.width * scale) / 2,
                            top: (canvas.height - img.height * scale) / 2,
                            selectable: false,
                            evented: false
                        });
                        
                        backgroundImageObj = img;
                        canvas.add(img);
                        canvas.sendToBack(img);
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Image move and resize controls
        document.getElementById('move-image').addEventListener('click', () => {
            if (backgroundImageObj) {
                backgroundImageObj.set({
                    selectable: true,
                    evented: true
                });
                canvas.setActiveObject(backgroundImageObj);
            }
        });

        document.getElementById('resize-image').addEventListener('click', () => {
            if (backgroundImageObj) {
                backgroundImageObj.set({
                    selectable: true,
                    evented: true
                });
                canvas.setActiveObject(backgroundImageObj);
            }
        });

        // Logo upload
        document.getElementById('logo-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    fabric.Image.fromURL(event.target.result, (img) => {
                        // Remove existing logo
                        if (logoObj) {
                            canvas.remove(logoObj);
                        }
                        
                        // Scale logo and position at top center
                        const maxLogoWidth = canvas.width * 0.3;
                        const maxLogoHeight = 100;
                        const scaleX = maxLogoWidth / img.width;
                        const scaleY = maxLogoHeight / img.height;
                        const scale = Math.min(scaleX, scaleY);
                        
                        img.set({
                            scaleX: scale,
                            scaleY: scale,
                            left: canvas.width / 2,
                            top: 50,
                            originX: 'center',
                            originY: 'top',
                            selectable: true,
                            evented: true
                        });
                        
                        logoObj = img;
                        canvas.add(img);
                        canvas.bringToFront(img);
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Headline text controls
        function updateHeadline() {
            const text = document.getElementById('headline-text').value;
            const font = document.getElementById('headline-font').value;
            const size = parseInt(document.getElementById('headline-size').value);
            const color = document.getElementById('headline-color').value;
            
            if (headlineObj) {
                canvas.remove(headlineObj);
            }
            
            if (text) {
                headlineObj = new fabric.Text(text, {
                    left: canvas.width / 2,
                    top: canvas.height * 0.4,
                    originX: 'center',
                    originY: 'center',
                    fontFamily: font,
                    fontSize: size,
                    fill: color,
                    fontWeight: 'bold',
                    selectable: true,
                    evented: true
                });
                
                canvas.add(headlineObj);
                canvas.bringToFront(headlineObj);
            }
        }

        document.getElementById('headline-text').addEventListener('input', updateHeadline);
        document.getElementById('headline-font').addEventListener('change', updateHeadline);
        document.getElementById('headline-size').addEventListener('input', updateHeadline);
        document.getElementById('headline-color').addEventListener('input', updateHeadline);

        // Subtitle text controls
        function updateSubtitle() {
            const text = document.getElementById('subtitle-text').value;
            const font = document.getElementById('subtitle-font').value;
            const size = parseInt(document.getElementById('subtitle-size').value);
            const color = document.getElementById('subtitle-color').value;
            
            if (subtitleObj) {
                canvas.remove(subtitleObj);
            }
            
            if (text) {
                subtitleObj = new fabric.Text(text, {
                    left: canvas.width / 2,
                    top: canvas.height * 0.6,
                    originX: 'center',
                    originY: 'center',
                    fontFamily: font,
                    fontSize: size,
                    fill: color,
                    selectable: true,
                    evented: true
                });
                
                canvas.add(subtitleObj);
                canvas.bringToFront(subtitleObj);
            }
        }

        document.getElementById('subtitle-text').addEventListener('input', updateSubtitle);
        document.getElementById('subtitle-font').addEventListener('change', updateSubtitle);
        document.getElementById('subtitle-size').addEventListener('input', updateSubtitle);
        document.getElementById('subtitle-color').addEventListener('input', updateSubtitle);

        // Text highlighting functionality
        document.getElementById('toggle-highlight').addEventListener('click', () => {
            const selectedObject = canvas.getActiveObject();
            if (selectedObject && selectedObject.type === 'text') {
                const highlightColor = document.getElementById('highlight-color').value;
                const highlightWidth = parseInt(document.getElementById('highlight-width').value);
                const highlightHeight = parseInt(document.getElementById('highlight-height').value);
                
                if (selectedObject.backgroundColor) {
                    // Remove highlight
                    selectedObject.set({
                        backgroundColor: '',
                        padding: 0
                    });
                } else {
                    // Add highlight
                    selectedObject.set({
                        backgroundColor: highlightColor,
                        padding: Math.max(highlightWidth, highlightHeight)
                    });
                }
                canvas.requestRenderAll();
            }
        });

        // Download functionality
        document.getElementById('download-png').addEventListener('click', () => {
            // Temporarily deselect all objects for clean export
            canvas.discardActiveObject();
            
            const link = document.createElement('a');
            link.download = 'poster.png';
            link.href = canvas.toDataURL({
                format: 'png',
                quality: 1
            });
            link.click();
        });

        document.getElementById('download-jpeg').addEventListener('click', () => {
            // Temporarily deselect all objects for clean export
            canvas.discardActiveObject();
            
            const link = document.createElement('a');
            link.download = 'poster.jpg';
            link.href = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.9
            });
            link.click();
        });

        // Initialize with default text
        updateHeadline();
        updateSubtitle();
    </script>
</body>
</html>
